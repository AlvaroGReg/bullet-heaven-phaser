name: Deploy to GitHub Pages

on:
  push:
    branches: [mobile-and-responsive]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main site
        uses: actions/checkout@v4
        with:
          ref: master
          path: main

      - name: Checkout mobile site
        uses: actions/checkout@v4
        with:
          ref: mobile-and-responsive
          path: mobile-and-responsive

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build main site
        working-directory: main
        run: |
          npm ci
          npm run build

      - name: Build mobile site
        working-directory: mobile-and-responsive
        run: npm ci

      - name: Assemble Pages site
        run: |
          npm run build --prefix mobile-and-responsive
          mkdir -p site/mobile-and-responsive
          cp -R main/dist/. site/
          cp -R mobile-and-responsive/dist/. site/mobile-and-responsive/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
